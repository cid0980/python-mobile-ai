<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpecDeck — Smartphone Hardware Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --charcoal: #171717;
      --charcoal-elevated: #1f1f1f;
      --charcoal-hover: #242424;
      --charcoal-border: #2b2b2b;

      --forest: #06110c;
      --forest-panel: #0b1912;
      --forest-elevated: #10231a;
      --forest-border: #193024;

      --crimson: #a31c1b;
      --crimson-hover: #b82220;
      --crimson-tint: rgba(163, 28, 27, 0.16);

      --compare-b: #d6dfd9;
      --compare-b-tint: rgba(214, 223, 217, 0.14);

      --ink-primary: #f2f4f3;
      --ink-secondary: #a3ada7;
      --ink-muted: #6c7771;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

      --r-modal: 16px;
      --r-composer: 14px;
      --r-bento-shell: 12px;
      --r-inner: 8px;
      --r-control: 8px;
      --r-micro: 6px;

      --ease-out: cubic-bezier(0.2, 0, 0, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      font-size: 16px;
    }

    body {
      height: 100%;
      overflow: hidden;
      background-color: var(--charcoal);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .tabular {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.015em;
    }

    svg.icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c3530; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3c4841; }

    .ui-chip,
    .telemetry-pill,
    .kbd-hint,
    .compare-count,
    .status-signal,
    .delta-badge,
    .verified-tag,
    .live-voice-tag,
    .source-link,
    .inline-model-tag,
    .spec-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: var(--r-micro);
      border: 1px solid var(--forest-border);
      background-color: var(--forest);
      color: var(--ink-secondary);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      line-height: 1.3;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .app-shell {
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 460px) minmax(0, 1fr);
      align-items: center;
      padding: 0 18px;
      background-color: var(--forest);
      border-bottom: 1px solid var(--forest-border);
      user-select: none;
      gap: 16px;
      min-width: 0;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background-color: var(--charcoal);
      border: 1px solid var(--crimson);
      display: grid;
      place-items: center;
      color: var(--crimson);
      flex-shrink: 0;
    }

    .brand-name {
      font-weight: 600;
      font-size: 0.90625rem;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
      white-space: nowrap;
    }

    .telemetry-pill {
      background-color: var(--forest-panel);
      border-color: var(--forest-border);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--ink-secondary);
      flex-shrink: 0;
    }
    .status-dot.ready {
      background-color: #3b8a63;
    }
    .status-dot.warn,
    .status-dot.busy {
      background-color: var(--crimson);
    }

    .omnibar {
      position: relative;
      display: flex;
      align-items: center;
      height: 34px;
      min-width: 0;
      background-color: var(--charcoal);
      border: 1px solid var(--forest-border);
      border-radius: var(--r-control);
      padding: 0 8px 0 10px;
      gap: 8px;
      transition: border-color 140ms var(--ease-out);
    }
    .omnibar:focus-within {
      border-color: var(--crimson);
    }
    .omnibar svg.icon {
      width: 14px;
      height: 14px;
      color: var(--ink-muted);
    }
    .omnibar input {
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 0.8125rem;
      text-overflow: ellipsis;
    }
    .omnibar input::placeholder {
      color: var(--ink-muted);
    }
    .kbd-hint {
      border-color: var(--charcoal-border);
      color: var(--ink-muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
    }

    .icon-trigger {
      position: relative;
      height: 34px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: var(--r-control);
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--ink-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 140ms var(--ease-out), background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .icon-trigger:hover {
      background-color: var(--forest-panel);
      border-color: var(--forest-border);
      color: var(--ink-primary);
    }
    .icon-trigger:active {
      transform: scale(0.96);
    }
    .icon-trigger.active {
      color: var(--ink-primary);
      background-color: var(--forest-panel);
      border-color: var(--crimson);
    }
    .icon-trigger.speaking {
      color: #ffffff;
      background-color: var(--crimson);
      border-color: var(--crimson);
    }
    .icon-trigger .key-dot {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--crimson);
    }

    .workspace {
      display: grid;
      grid-template-columns: 520px minmax(0, 1fr);
      min-height: 0;
      min-width: 0;
      height: calc(100vh - 52px);
      overflow: hidden;
    }

    @media (max-width: 1080px) {
      .workspace { grid-template-columns: 440px minmax(0, 1fr); }
    }

    .deck-pane {
      display: flex;
      flex-direction: column;
      background-color: var(--forest);
      border-right: 1px solid var(--forest-border);
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }

    .pane-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
      padding: 0 18px;
      border-bottom: 1px solid var(--forest-border);
      flex-shrink: 0;
      min-width: 0;
      gap: 12px;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
      height: 100%;
      min-width: 0;
    }

    .nav-tab {
      position: relative;
      height: 100%;
      background: none;
      border: none;
      color: var(--ink-muted);
      font-family: var(--font-sans);
      font-size: 0.8125rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: color 140ms ease;
    }
    .nav-tab:hover { color: var(--ink-secondary); }
    .nav-tab.active { color: var(--ink-primary); }
    .nav-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background-color: var(--crimson);
    }

    .compare-count {
      background-color: var(--forest-panel);
    }

    .quiet-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .micro-icon-btn {
      padding: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-muted);
      border-radius: var(--r-micro);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 140ms ease, background-color 140ms ease, border-color 140ms ease;
    }
    .micro-icon-btn:hover {
      color: var(--ink-primary);
      background-color: var(--forest-panel);
      border-color: var(--forest-border);
    }

    .deck-scroll {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 18px 28px;
    }

    .sample-tag {
      font-size: 0.75rem;
      line-height: 1.4;
      color: var(--ink-muted);
      margin-bottom: 12px;
    }

    .device-hero {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
      padding: 14px;
      background-color: var(--charcoal);
      border: 1px solid var(--forest-border);
      border-radius: var(--r-bento-shell);
      min-width: 0;
      min-height: 0;
    }

    .phone-photo-frame {
      width: 112px;
      height: 144px;
      border-radius: var(--r-inner);
      background-color: #ffffff;
      border: 1px solid var(--charcoal-border);
      padding: 8px;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .phone-photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .hero-meta {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      min-height: 0;
    }

    .device-eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--ink-secondary);
      min-width: 0;
    }
    .device-eyebrow > span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .status-signal {
      color: var(--ink-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .device-title {
      margin-top: 6px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.22;
      color: var(--ink-primary);
      word-break: break-word;
    }

    .device-tagline {
      margin-top: 4px;
      font-size: 0.78125rem;
      color: var(--ink-secondary);
      line-height: 1.45;
      word-break: break-word;
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--charcoal-border);
      min-width: 0;
    }
    .hero-metrics > div {
      min-width: 0;
    }

    .ticker-cell-label {
      font-size: 0.625rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
    }

    .ticker-cell-val {
      margin-top: 2px;
      font-size: 0.78125rem;
      font-weight: 600;
      color: var(--ink-primary);
      word-break: break-word;
    }
    .ticker-cell-val.price {
      color: #f5f5f5;
    }

    .telemetry-block {
      margin-top: 14px;
      padding: 14px;
      border-radius: var(--r-bento-shell);
      background-color: var(--charcoal);
      border: 1px solid var(--forest-border);
      display: grid;
      grid-template-columns: 174px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .radar-wrap {
      width: 100%;
      max-width: 174px;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .radar-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 174px;
    }

    .score-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
      min-height: 0;
    }

    .score-row {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) 32px;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      min-width: 0;
    }

    .score-name {
      color: var(--ink-secondary);
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-track {
      height: 4px;
      border-radius: 2px;
      background-color: #262626;
      overflow: hidden;
      min-width: 0;
    }

    .score-fill {
      height: 100%;
      border-radius: 2px;
      background-color: var(--crimson);
      transform-origin: left center;
      transition: transform 280ms var(--ease-out);
    }

    .score-num {
      text-align: right;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .section-caption {
      margin: 16px 0 8px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    .bento-shell {
      padding: 4px;
      border-radius: var(--r-bento-shell);
      background-color: var(--forest-panel);
      border: 1px solid var(--forest-border);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      min-width: 0;
      min-height: 0;
    }

    .spec-cell {
      padding: 10px 11px;
      border-radius: var(--r-inner);
      background-color: var(--charcoal);
      border: 1px solid #222222;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      min-height: 0;
    }
    .spec-cell.wide { grid-column: span 2; }

    .spec-cell-head {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-muted);
      font-size: 0.65625rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      min-width: 0;
    }
    .spec-cell-head svg.icon {
      width: 13px;
      height: 13px;
      color: var(--crimson);
    }

    .spec-cell-body {
      font-size: 0.78125rem;
      line-height: 1.45;
      color: var(--ink-primary);
      min-width: 0;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .signals-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      margin-top: 14px;
      min-width: 0;
    }

    .signal-card {
      padding: 12px 13px;
      border-radius: var(--r-inner);
      background-color: var(--charcoal);
      border: 1px solid var(--forest-border);
      min-width: 0;
      min-height: 0;
    }

    .signal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      min-width: 0;
    }

    .signal-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.78125rem;
      color: var(--ink-primary);
      line-height: 1.45;
      min-width: 0;
      word-break: break-word;
    }
    .signal-list.tradeoffs li { color: var(--ink-secondary); }

    .sig-marker {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.45;
      flex-shrink: 0;
    }
    .sig-marker.pos { color: #4ba376; }
    .sig-marker.warn { color: var(--crimson); }

    .verdict-note {
      margin-top: 12px;
      padding: 11px 13px;
      border-left: 2px solid var(--crimson);
      background-color: var(--charcoal);
      border-top: 1px solid var(--forest-border);
      border-right: 1px solid var(--forest-border);
      border-bottom: 1px solid var(--forest-border);
      border-radius: 0 var(--r-control) var(--r-control) 0;
      font-size: 0.78125rem;
      line-height: 1.5;
      color: var(--ink-secondary);
      min-width: 0;
      word-break: break-word;
    }

    .compare-omnibar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      padding: 4px;
      background-color: var(--forest-panel);
      border: 1px solid var(--forest-border);
      border-radius: var(--r-bento-shell);
      margin-bottom: 14px;
      min-width: 0;
    }

    .compare-omnibar input {
      width: 100%;
      min-width: 0;
      height: 30px;
      padding: 0 9px;
      border-radius: var(--r-inner);
      border: 1px solid var(--charcoal-border);
      background-color: var(--charcoal);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 0.78125rem;
      outline: none;
      text-overflow: ellipsis;
    }
    .compare-omnibar input:focus { border-color: var(--crimson); }
    .vs-divider {
      font-family: var(--font-mono);
      font-size: 0.65625rem;
      color: var(--ink-muted);
      padding: 0 2px;
    }
    .compare-go {
      height: 30px;
      width: 32px;
      border-radius: var(--r-inner);
      border: none;
      background-color: var(--crimson);
      color: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 140ms var(--ease-out), background-color 140ms ease;
    }
    .compare-go:hover { background-color: var(--crimson-hover); }
    .compare-go:active { transform: scale(0.96); }

    .compare-legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
      min-width: 0;
    }

    .legend-card {
      padding: 10px;
      border-radius: var(--r-inner);
      background-color: var(--charcoal);
      border: 1px solid var(--forest-border);
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
      min-height: 0;
    }
    .legend-card > div:last-child {
      min-width: 0;
    }
    .legend-thumb {
      width: 50px;
      height: 64px;
      border-radius: 6px;
      background-color: #ffffff;
      border: 1px solid var(--charcoal-border);
      padding: 4px;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .legend-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .legend-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .legend-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-name {
      font-weight: 600;
      font-size: 0.78125rem;
      color: var(--ink-primary);
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .legend-sub {
      margin-top: 4px;
      font-size: 0.6875rem;
      color: var(--ink-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dual-radar-box {
      padding: 12px;
      border-radius: var(--r-bento-shell);
      background-color: var(--charcoal);
      border: 1px solid var(--forest-border);
      display: grid;
      grid-template-columns: 174px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .delta-table {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      min-height: 0;
    }
    .delta-row {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) auto;
      align-items: center;
      font-size: 0.75rem;
      gap: 6px;
      min-width: 0;
    }
    .delta-pair {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      white-space: nowrap;
    }
    .val-a { color: #e05251; font-weight: 600; }

    .composer-dock {

    .inline-model-tag {

    .native-select {

      background-repeat: no-repeat;
      background-position: right 10px center;
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--forest-border);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 0.8125rem;
      outline: none;
      cursor: pointer;
      transition: border-color 140ms ease;

    .test-voice-btn {

      padding: 0 13px;

    .toggle-list { display: flex; flex-direction: column; gap: 11px; padding-top: 2px; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

    .switch-track {
      position: relative;
      width: 36px;
      height: 20px;
      border-radius: 999px;
      background-color: var(--charcoal);
      border: 1px solid var(--charcoal-border);
      transition: background-color 150ms ease, border-color 150ms ease;
      flex-shrink: 0;
    }
    .switch-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: var(--ink-secondary);
      transition: transform 160ms var(--ease-out), background-color 150ms ease;
    }
    input[type="checkbox"].sr-only { position: absolute; opacity: 0; pointer-events: none; }
    input[type="checkbox"].sr-only:checked + .switch-track {
      background-color: var(--crimson);
      border-color: var(--crimson);

    .modal-foot {

    .toast {
      position: fixed;

      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms var(--ease-out);
      z-index: 200;
    }
    .toast.show { opacity: 1; }

    /* SpecDeck workstation refinement: fewer nested boxes, clearer data hierarchy. */
    :root {
      --charcoal: #151a17;
      --charcoal-elevated: #1c231e;
      --charcoal-hover: #222b25;
      --charcoal-border: #2a342d;
      --forest: #09120d;
      --forest-panel: #101b14;
      --forest-elevated: #16241b;
      --forest-border: #26372c;
      --crimson: #b4433d;
      --crimson-hover: #c6534b;
      --crimson-tint: rgba(180, 67, 61, 0.14);
      --ink-primary: #f0f3f0;
      --ink-secondary: #a9b4ac;
      --ink-muted: #7d8a81;
      --r-bento-shell: 9px;
      --r-inner: 5px;
      --r-control: 6px;
    }

    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {

      background: #16241a;
      border-color: #34463a;
      text-transform: none;
      letter-spacing: 0;
    }
    .device-title { margin-top: 7px; font-size: clamp(1.22rem, 1.5vw, 1.52rem); line-height: 1.16; }
    .device-tagline { max-width: 40ch; font-size: 0.8125rem; line-height: 1.5; }
    .hero-metrics { gap: 12px; margin-top: 14px; padding-top: 11px; border-color: #26332b; }
    .ticker-cell-label { font-family: var(--font-sans); font-size: 0.6875rem; text-transform: none; letter-spacing: 0; color: var(--ink-muted); }
    .ticker-cell-val { font-size: 0.8125rem; }

    .telemetry-block {
      grid-template-columns: minmax(150px, 0.95fr) minmax(0, 1fr);
      gap: 10px;
      margin-top: 14px;
      padding: 8px 0 14px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--forest-border);
      border-radius: 0;
    }
    .radar-wrap { max-width: 190px; }
    .radar-wrap svg { max-width: 190px; }
    .score-list { gap: 10px; }
    .score-row { grid-template-columns: 72px minmax(0, 1fr) 30px; gap: 8px; }
    .score-name { font-size: 0.75rem; }
    .score-track { height: 5px; background: #27312a; }
    .score-fill { background: #c4564f; }
    .score-num { font-size: 0.75rem; font-variant-numeric: tabular-nums; }

    .section-caption {
      margin: 19px 0 9px;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      font-weight: 600;
      text-transform: none;
      letter-spacing: -0.015em;
      color: var(--ink-primary);
    }
    .bento-shell {
      padding: 0;
      gap: 0 16px;
      background: transparent;
      border: 0;
      border-radius: 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .spec-cell, .spec-cell.wide {
      grid-column: auto;
      padding: 10px 0 11px;
      gap: 5px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid #26332b;
      border-radius: 0;
    }
    .spec-cell.wide { grid-column: span 2; }
    .spec-cell-head {
      gap: 7px;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      text-transform: none;
      letter-spacing: 0;
      color: var(--ink-muted);
    }
    .spec-cell-head svg.icon { width: 14px; height: 14px; color: #c06a63; }
    .spec-cell-body { font-size: 0.8125rem; line-height: 1.5; color: #e1e7e2; }
    .signals-grid { margin-top: 12px; gap: 12px; }
    .signal-card {
      padding: 12px 0;
      background: transparent;
      border: 0;
      border-top: 1px solid var(--forest-border);
      border-radius: 0;
    }
    .signal-list { gap: 7px; margin-top: 7px; }
    .verdict-note {
      margin-top: 10px;
      padding: 10px 12px;
      background: #121c15;
      border-color: #28372d;
      border-left-color: var(--crimson);
      border-radius: 0 4px 4px 0;
    }

    .stream-pane { background: #151a17; }
    .stream-header {
      min-height: 46px;
      padding-inline: 26px;
      background: #151a17;
      border-bottom-color: #28322b;
    }
    .stream-context { gap: 9px; font-size: 0.8125rem; }
    .stream-context > span:first-child { color: var(--ink-muted); }
    .stream-context strong { font-weight: 550; }
    .stream-feed { padding: 30px clamp(24px, 4vw, 58px) 24px; }
    .stream-inner { max-width: 790px; }
    .editorial-welcome { padding-top: 8px; }
    .welcome-kicker {
      margin-bottom: 9px;
      font-size: 0.75rem;
      text-transform: none;
      letter-spacing: 0.01em;
      color: #d17a72;
    }
    .welcome-heading { max-width: 36ch; margin-bottom: 20px; font-size: clamp(1.35rem, 2vw, 1.7rem); line-height: 1.28; }
    .advisor-brief-card {
      margin-bottom: 22px;
      padding: 15px 0 14px;
      background: transparent;
      border: 0;
      border-top: 1px solid #344138;
      border-bottom: 1px solid #344138;
      border-radius: 0;
    }
    .prose, .prose p, .prose li { font-size: 0.90625rem; line-height: 1.72; }
    .prose p { margin-bottom: 0.9rem; }
    .prose h3, .prose h4 {
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      font-weight: 600;
      text-transform: none;
      letter-spacing: -0.01em;
      color: var(--ink-primary);
      margin-top: 1.3rem;
    }
    .prose code { color: #e1c6c3; }
    .spec-pill-bar { gap: 7px; margin-top: 14px; padding-top: 12px; border-color: #29362d; }
    .spec-pill {
      padding: 5px 9px;
      background: #131c16;
      border-color: #303c33;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
    }
    .index-list { border-top-color: #303a32; }
    .index-item {
      grid-template-columns: minmax(0, 1fr) minmax(140px, auto) auto;
      gap: 12px;
      padding: 13px 8px;
      border-bottom-color: #28322b;
    }
    .index-item:hover { background: #111a14; }
    .index-item-title { font-size: 0.875rem; white-space: normal; }
    .index-item-chip { justify-content: flex-start; background: transparent; border-color: transparent; font-size: 0.65625rem; }
    .turn-user {
      max-width: min(78%, 620px);
      margin-bottom: 20px;
      padding: 11px 15px;
      border-radius: 9px 9px 2px 9px;
      background: #202923;
      border-color: #344239;
    }
    .turn-ai { margin-bottom: 22px; padding-bottom: 18px; border-color: #303a32; }
    .turn-ai-head { margin-bottom: 9px; }
    .turn-ai-author { font-size: 0.8125rem; }
    .turn-ai-meta { gap: 9px; }
    .live-voice-tag { padding: 2px 7px; background: #3d2422; border-color: #56302d; color: #e8b3ae; text-transform: none; letter-spacing: 0; }
    .turn-actions { opacity: 0.5; }
    .turn-ai:hover .turn-actions, .turn-actions:focus-within { opacity: 1; }
    .sources-line { gap: 7px; margin-top: 12px; }
    .source-link {
      padding: 4px 8px;
      background: #111a14;
      border-color: #344238;
      color: #c0cbc2;
      font-family: var(--font-sans);
      font-size: 0.6875rem;
      text-decoration: none;
    }
    .composer-dock { padding: 12px 24px 17px; background: #151a17; border-top-color: #2c362e; }
    .composer-shell {
      background: #101a13;
      border-color: #344238;
      border-radius: 8px;
      padding-left: 15px;
    }
    .composer-input { font-size: 0.90625rem; }
    .inline-model-tag { border-radius: 4px; font-size: 0.65625rem; }
    .send-action { border-radius: 5px; }

    .modal-sheet { border-radius: 9px; }
    .modal-head, .modal-foot { background: #111a14; }
    .modal-head { padding: 15px 20px; }
    .modal-body { padding: 18px 20px; }
    .modal-foot { padding: 13px 20px; }
    .toast { border-color: #70423e; border-radius: 5px; }

    @media (max-width: 1180px) {
      .workspace { grid-template-columns: minmax(380px, 44%) minmax(0, 1fr); }
      .topbar { grid-template-columns: minmax(160px, 1fr) minmax(240px, 390px) minmax(150px, 1fr); gap: 12px; padding-inline: 16px; }
      .deck-scroll { padding-inline: 18px; }
      .stream-feed { padding-inline: 30px; }
      .telemetry-block { grid-template-columns: minmax(130px, 0.85fr) minmax(0, 1fr); }
      .score-row { grid-template-columns: 62px minmax(0, 1fr) 28px; gap: 6px; }
    }
    @media (max-width: 900px) and (min-width: 701px) {
      .workspace { grid-template-columns: minmax(340px, 46%) minmax(0, 1fr); }
      .topbar { grid-template-columns: 1fr minmax(220px, 1.1fr) auto; }
      .brand-cluster { gap: 7px; }
      .telemetry-pill { display: none; }
      .top-actions #voiceBtn { padding-inline: 7px; }
      .top-actions #voiceBtn span { display: none; }
      .stream-feed { padding-inline: 22px; }
      .composer-dock { padding-inline: 16px; }
      .inline-model-tag { max-width: 112px; overflow: hidden; text-overflow: ellipsis; }
      .device-hero { grid-template-columns: 106px minmax(0, 1fr); gap: 13px; }
      .phone-photo-frame { height: 145px; }
      .telemetry-block { grid-template-columns: 1fr; }
      .radar-wrap { display: none; }
    }
    @media (max-width: 700px) {
      html, body { height: auto; min-height: 100%; }
      body { overflow: auto; }
      .app-shell { width: 100%; height: auto; min-height: 100vh; overflow: visible; grid-template-rows: auto auto; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto auto;
        gap: 8px 12px;
        padding: 9px 14px 10px;
        min-height: 96px;
      }
      .brand-cluster { grid-column: 1; grid-row: 1; }
      .brand-mark { width: 27px; height: 27px; }
      .telemetry-pill { display: none; }
      .omnibar { grid-column: 1 / -1; grid-row: 2; width: 100%; }
      .top-actions { grid-column: 2; grid-row: 1; }
      .top-actions #voiceBtn { min-width: 34px; width: 34px; padding: 0; }
      .top-actions #voiceBtn span { display: none; }
      .workspace { display: flex; flex-direction: column; height: auto; min-height: 0; overflow: visible; }
      .deck-pane { flex: none; max-height: none; overflow: visible; border-right: 0; border-bottom: 1px solid var(--forest-border); }
      .pane-nav { padding-inline: 16px; }
      .deck-scroll { overflow: visible; padding: 15px 16px 22px; }
      .device-hero { grid-template-columns: 104px minmax(0, 1fr); gap: 13px; }
      .phone-photo-frame { height: 138px; }
      .device-title { font-size: 1.18rem; }
      .telemetry-block { grid-template-columns: minmax(112px, 0.8fr) minmax(0, 1fr); gap: 8px; }
      .radar-wrap, .radar-wrap svg { max-width: 138px; }
      .score-row { grid-template-columns: 60px minmax(0, 1fr) 27px; gap: 5px; }
      .score-name, .score-num { font-size: 0.6875rem; }
      .bento-shell { gap: 0 12px; }
      .spec-cell, .spec-cell.wide { grid-column: auto; }
      .stream-pane { flex: none; min-height: 580px; overflow: visible; }
      .stream-header { position: sticky; top: 96px; z-index: 10; padding-inline: 16px; }
      .stream-feed { flex: none; min-height: 300px; max-height: 62vh; padding: 22px 17px; }
      .stream-inner { max-width: none; }
      .welcome-heading { font-size: 1.35rem; }
      .advisor-brief-card { padding-block: 13px; }
      .index-item { grid-template-columns: minmax(0, 1fr) auto; }
      .index-item-chip { display: none; }
      .turn-user { max-width: 90%; }
      .composer-dock { position: sticky; bottom: 0; z-index: 15; padding: 9px 12px calc(10px + env(safe-area-inset-bottom)); }
      .composer-shell { grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
      .composer-input { min-height: 40px; }
      .inline-model-tag { display: none; }
      .send-action { width: 38px; height: 38px; }
      .modal-sheet { max-height: 90vh; overflow-y: auto; }
      .modal-body { padding: 15px; }
      .modal-head, .modal-foot { padding-inline: 15px; }
      .key-input-shell { flex-wrap: wrap; }
      .key-input-shell input { flex-basis: 100%; }
    }
    @media (max-width: 390px) {
      .deck-scroll { padding-inline: 13px; }
      .device-hero { grid-template-columns: 86px minmax(0, 1fr); gap: 10px; }
      .phone-photo-frame { height: 124px; }
      .device-title { font-size: 1.08rem; }
      .hero-metrics { gap: 7px; }
      .telemetry-block { grid-template-columns: 1fr; }
      .radar-wrap { display: none; }
      .spec-cell-head { font-size: 0.6875rem; }
      .spec-cell-body { font-size: 0.75rem; }
      .stream-context > span:first-child, .stream-context > span:nth-child(2) { display: none; }
      .stream-feed { padding-inline: 14px; }
      .turn-ai-meta { gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-cluster">
        <div class="brand-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24">
            <rect x="6" y="3" width="12" height="18" rx="2.5"></rect>
            <line x1="10" y1="18" x2="14" y2="18"></line>
          </svg>
        </div>
        <span class="brand-name">SpecDeck</span>
        <div class="telemetry-pill tabular" id="telemetryPill">
          <span class="status-dot ready" id="statusDot"></span>
          <span id="telemetryText">READY</span>
        </div>
      </div>

      <form class="omnibar" id="omniForm" autocomplete="off">
        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
        </svg>
        <input
          type="text"
          id="omniInput"
          placeholder="Search phone or compare (OnePlus 13 vs S25 Ultra)"
        />
        <span class="kbd-hint">⌘K</span>
      </form>

      <div class="top-actions">
        <button class="icon-trigger active" id="voiceBtn" title="Synchronized Voice Output">
          <svg class="icon speaker-svg" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg class="icon mute-svg" viewBox="0 0 24 24" style="display:none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
          <span id="voiceStateLabel">VOICE ON</span>
        </button>

        <button class="icon-trigger" id="settingsBtn" title="Settings & API Key (Ctrl+,)">
          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span class="key-dot" id="missingKeyDot" style="display: none;"></span>
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="deck-pane">
        <div class="pane-nav">
          <div class="nav-tabs">
            <button class="nav-tab active" data-tab="single" id="tabSingle">Datasheet</button>
            <button class="nav-tab" data-tab="compare" id="tabCompare">
              Head-to-Head <span class="compare-count" id="compareBadge">A/B</span>
            </button>
          </div>
          <div class="quiet-tools">
            <button class="micro-icon-btn" id="copySheetBtn" title="Copy Markdown Datasheet">
              <svg class="icon" viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
            <button class="micro-icon-btn" id="exportSheetBtn" title="Download Report (.md)">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="deck-scroll" id="deckContainer"></div>
      </aside>

      <section class="stream-pane">
        <div class="stream-header">
          <div class="stream-context" id="streamContext">
            <span>Advisor Context</span>
            <span>·</span>
            <strong id="activeContextLabel">OnePlus 13</strong>
          </div>
          <button class="micro-icon-btn" id="resetThreadBtn" title="Reset Session">
            <svg class="icon" viewBox="0 0 24 24">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
          </button>
        </div>

        <div class="stream-feed" id="streamFeed">
          <div class="stream-inner" id="streamInner"></div>
        </div>

        <div class="composer-dock">
          <form class="composer-shell" id="chatForm" autocomplete="off">
            <input
              type="text"
              class="composer-input"
              id="chatInput"
              placeholder="Ask about any mobile phone, camera, gaming, battery, or compare two models..."
            />
            <button
              type="button"
              class="inline-model-tag tabular"
              id="modelQuickBtn"
              title="Change AI Model in Settings"
            >llama-3.3-70b</button>
            <button type="submit" class="send-action" id="sendBtn" title="Send">
              <svg class="icon" viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-head">
        <h2>Settings & Credentials</h2>
        <button class="micro-icon-btn" id="closeSettingsBtn" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="field-group">
          <div class="field-label-row">
            <span>Groq API Key</span>
            <a class="ext-link" href="https://console.groq.com/keys" target="_blank" rel="noopener">
              console.groq.com/keys ↗
            </a>
          </div>
          <div class="key-input-shell">
            <input type="password" id="apiKeyInput" placeholder="Paste gsk_ key from console.groq.com" spellcheck="false" />
            <button type="button" class="shell-action" id="pasteKeyBtn">Paste</button>
            <button type="button" class="shell-action" id="toggleMaskBtn">Show</button>
            <button type="button" class="shell-action" id="verifyKeyBtn">Verify</button>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label-row"><span>Default AI Model</span></div>
          <select class="native-select tabular" id="modelSelect"></select>
        </div>

        <div class="field-group">
          <div class="field-label-row"><span>Neural Voice & Preview</span></div>
          <div class="voice-control-row">
            <select class="native-select" id="voiceSelect"></select>
            <button type="button" class="shell-action test-voice-btn" id="testVoiceBtn">Test Voice</button>
          </div>
        </div>

        <div class="toggle-list">
          <label class="toggle-row">
            <div>
              <div>Live Web Grounding</div>
              <div class="toggle-sub">Fetch launch dates, retail prices & GSMArena specs via DuckDuckGo</div>
            </div>
            <input type="checkbox" class="sr-only" id="webSearchToggle" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>

          <label class="toggle-row">
            <div>
              <div>Synchronized Voice + Word Reveal</div>
              <div class="toggle-sub">Speak replies and reveal words one-by-one in lockstep with the voice</div>
            </div>
            <input type="checkbox" class="sr-only" id="autoVoiceToggle" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>

          <label class="toggle-row">
            <div>
              <div>Launch on System Login</div>
              <div class="toggle-sub">Register XDG Autostart (Linux) or Startup launcher (Windows)</div>
            </div>
            <input type="checkbox" class="sr-only" id="autostartToggle" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
      </div>

      <div class="modal-foot">
        <span class="modal-feedback tabular" id="modalFeedback">Saved locally to .env</span>
        <button type="button" class="primary-save" id="saveSettingsBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SPEC_ICONS = {
      display: '<rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
      processor: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>',
      ram_storage: '<path d="M4 6h16v12H4z"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="16" y1="10" x2="16" y2="14"/>',
      rear_camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
      front_camera: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',
      battery_charging: '<rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><polyline points="11 9 8 12 12 12 9 15"/>',
      os_updates: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
      build_extras: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'
    };

    const state = {

    const syncAudio = new Audio();

    const previewAudio = new Audio();
    previewAudio.preload = 'auto';
    let audioUnlocked = false;

    function unlockAudioOnGesture() {
      if (audioUnlocked) return;
      try {
        syncAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
        syncAudio.volume = 0.01;
        const p = syncAudio.play();
        if (p && p.then) {
          p.then(() => {
            syncAudio.pause();
            syncAudio.volume = 1.0;
            audioUnlocked = true;
          }).catch(() => {

          });

    const el = (id) => document.getElementById(id);

    function showToast(msg) {
      const t = el('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function sanitizeUiString(val) {
      return String(val ?? '')
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F\uFFFD]/g, '')
        .replace(/\$X{2,}|\u20B9X[\dX,]*/gi, '')
        .trim();
    }

    function escapeHtml(str) {
      return sanitizeUiString(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function phoneImageUrl(card) {
      if (!card || !card.name) return '';
      const params = new URLSearchParams({
        name: sanitizeUiString(card.name),
        brand: sanitizeUiString(card.brand || '')
      });
      return `/api/phone-image?${params.toString()}`;
    }

    function renderMarkdown(md) {
      const cleaned = sanitizeUiString(md);
      if (!cleaned) return '<p>Ready.</p>';
      const lines = cleaned.split('\n');
      let html = '';
      let inList = false;

      const formatInline = (s) =>
        escapeHtml(s)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code class="tabular">$1</code>');

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          if (inList) { html += '</ul>'; inList = false; }
          continue;
        }
        const hMatch = line.match(/^#{1,4}\s+(.*)$/);
        if (hMatch) {
          if (inList) { html += '</ul>'; inList = false; }
          html += `<h3>${formatInline(hMatch[1])}</h3>`;
          continue;
        }
        const bMatch = line.match(/^[-*•]\s+(.*)$/);
        if (bMatch) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += `<li>${formatInline(bMatch[1])}</li>`;
          continue;
        }
        if (inList) { html += '</ul>'; inList = false; }
        html += `<p>${formatInline(line)}</p>`;
      }
      if (inList) html += '</ul>';
      return html || '<p>Ready.</p>';
    }

    function buildWordSyncedFragment(markdownSegment) {
      const temp = document.createElement('div');
      temp.innerHTML = renderMarkdown(markdownSegment);

      const wordItems = [];
      const lineBlocks = temp.querySelectorAll('h3, h4, li, p');

      lineBlocks.forEach((lineEl) => {
        lineEl.classList.add('sync-line', 'pending');
        const walker = document.createTreeWalker(lineEl, NodeFilter.SHOW_TEXT, null);
        const textNodes = [];
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeValue && node.nodeValue.trim()) {
            textNodes.push(node);
          }
        }

        textNodes.forEach((tNode) => {
          const parts = tNode.nodeValue.split(/(\s+)/);
          const frag = document.createDocumentFragment();
          for (const part of parts) {
            if (!part) continue;
            if (/^\s+$/.test(part)) {
              frag.appendChild(document.createTextNode(part));
            } else {
              const span = document.createElement('span');
              span.className = 'w-tok';
              span.textContent = part;
              frag.appendChild(span);
              wordItems.push({ span, lineEl, text: part, startMs: 0, endMs: 0 });
            }
          }
          tNode.parentNode.replaceChild(frag, tNode);
        });
      });

      const outFrag = document.createDocumentFragment();
      while (temp.firstChild) {
        outFrag.appendChild(temp.firstChild);
      }
      return { fragment: outFrag, wordItems };
    }

    function normalizeWord(s) {
      return String(s || '').toLowerCase().replace(/[^a-z0-9₹$]/g, '');
    }

    function alignWordsWithBoundaries(wordItems, rawBoundaries, totalDurationMs) {
      const M = wordItems.length;
      if (!M) return;

      const expanded = [];
      for (const b of (rawBoundaries || [])) {
        const subParts = String(b.text || '').trim().split(/\s+/).filter(Boolean);
        if (!subParts.length) continue;
        const totalChars = subParts.reduce((acc, p) => acc + p.length, 0) || 1;
        let curOffset = Number(b.offset_ms || 0);
        const fullDur = Math.max(40, Number(b.duration_ms || 120));
        for (const sp of subParts) {
          const subDur = fullDur * (sp.length / totalChars);
          expanded.push({
            norm: normalizeWord(sp),
            offset_ms: curOffset,
            end_ms: curOffset + subDur
          });
          curOffset += subDur;
        }
      }

      if (!expanded.length) {
        const fallbackTotal = Math.max(300, totalDurationMs || M * 52);
        const step = fallbackTotal / M;
        wordItems.forEach((w, idx) => {
          w.startMs = idx * step;
          w.endMs = (idx + 1) * step;
        });
        return;
      }

      const anchors = new Array(M).fill(null);
      let bIdx = 0;

      for (let i = 0; i < M && bIdx < expanded.length; i++) {
        const wNorm = normalizeWord(wordItems[i].text);
        if (!wNorm) continue;

        const maxLook = Math.min(expanded.length, bIdx + 5);
        for (let j = bIdx; j < maxLook; j++) {
          const bNorm = expanded[j].norm;
          if (!bNorm) continue;
          if (wNorm === bNorm || wNorm.startsWith(bNorm) || bNorm.startsWith(wNorm)) {
            anchors[i] = { startMs: expanded[j].offset_ms, endMs: expanded[j].end_ms };
            bIdx = j + 1;
            break;
          }
        }
      }

      const finalEndMs = Math.max(
        totalDurationMs || 0,
        expanded[expanded.length - 1].end_ms + 80
      );

      let i = 0;
      while (i < M) {
        if (anchors[i]) {
          wordItems[i].startMs = anchors[i].startMs;
          wordItems[i].endMs = anchors[i].endMs;
          i++;
          continue;
        }
        const gapStart = i;
        while (i < M && !anchors[i]) i++;
        const gapEnd = i;
        const leftMs = gapStart > 0 ? wordItems[gapStart - 1].endMs : Math.max(0, expanded[0].offset_ms - 40);
        const rightMs = gapEnd < M ? anchors[gapEnd].startMs : finalEndMs;
        const count = gapEnd - gapStart;
        const spanMs = Math.max(20, rightMs - leftMs);
        const step = spanMs / (count + 1);
        for (let k = 0; k < count; k++) {
          const idx = gapStart + k;
          wordItems[idx].startMs = leftMs + step * k;
          wordItems[idx].endMs = leftMs + step * (k + 1);
        }
      }

      for (let k = 1; k < M; k++) {
        if (wordItems[k].startMs < wordItems[k - 1].startMs) {
          wordItems[k].startMs = wordItems[k - 1].startMs;
        }
        if (wordItems[k].endMs < wordItems[k].startMs + 25) {
          wordItems[k].endMs = wordItems[k].startMs + 25;
        }
      }
    }

    function base64ToBlobUrl(b64, mime = 'audio/mpeg') {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return URL.createObjectURL(new Blob([bytes], { type: mime }));
    }

    function playSegmentInLockstep(seg, proseEl, sessionId) {
      return new Promise((resolve) => {
        if (sessionId !== state.syncSessionId) return resolve();

        const { fragment, wordItems } = buildWordSyncedFragment(seg.markdown);
        alignWordsWithBoundaries(wordItems, seg.words, seg.duration_ms);
        proseEl.appendChild(fragment);

        const revealAllInSegment = () => {
          wordItems.forEach((w) => {
            w.lineEl.classList.remove('pending');
            w.span.classList.remove('speaking-word');
            w.span.classList.add('revealed');
          });
        };

        const runTimedFallback = (msPerWord = 42) => {
          let idx = 0;
          const tick = () => {
            if (sessionId !== state.syncSessionId) return resolve();
            if (idx >= wordItems.length) {
              revealAllInSegment();
              return resolve();
            }
            const item = wordItems[idx];
            if (item.lineEl.classList.contains('pending')) {
              item.lineEl.classList.remove('pending');
              scrollStreamIfNearBottom();
            }
            if (idx > 0) wordItems[idx - 1].span.classList.remove('speaking-word');
            item.span.classList.add('revealed', 'speaking-word');
            idx++;
            setTimeout(tick, msPerWord);
          };
          tick();
        };

        if (!seg.audio_b64) {
          return runTimedFallback(26);
        }

        const blobUrl = base64ToBlobUrl(seg.audio_b64);
        let rafId = null;
        let finished = false;

        const finishSegment = () => {
          if (finished) return;
          finished = true;
          if (rafId) cancelAnimationFrame(rafId);
          syncAudio.onended = null;
          syncAudio.onerror = null;
          URL.revokeObjectURL(blobUrl);
          if (sessionId === state.syncSessionId) {
            revealAllInSegment();
          }
          resolve();
        };

        const renderFrame = () => {
          if (finished || sessionId !== state.syncSessionId) {
            return finishSegment();
          }
          const nowMs = syncAudio.currentTime * 1000 + 30;
          let scrolledThisFrame = false;

          for (let i = 0; i < wordItems.length; i++) {
            const w = wordItems[i];
            if (nowMs >= w.startMs) {
              if (w.lineEl.classList.contains('pending')) {
                w.lineEl.classList.remove('pending');
                if (!scrolledThisFrame) {
                  scrollStreamIfNearBottom();
                  scrolledThisFrame = true;
                }
              }
              w.span.classList.add('revealed');
              const isCurrent = nowMs <= w.endMs + 75 && (i === wordItems.length - 1 || nowMs < wordItems[i + 1].startMs + 25);
              w.span.classList.toggle('speaking-word', isCurrent);
            }
          }
          rafId = requestAnimationFrame(renderFrame);
        };

        syncAudio.onended = finishSegment;
        syncAudio.onerror = () => {
          URL.revokeObjectURL(blobUrl);
          finished = true;
          if (rafId) cancelAnimationFrame(rafId);
          runTimedFallback(36);
        };

        syncAudio.src = blobUrl;
        syncAudio.volume = 1.0;
        const playPromise = syncAudio.play();
        if (playPromise && playPromise.then) {
          playPromise.then(() => {
            if (sessionId !== state.syncSessionId) return finishSegment();
            rafId = requestAnimationFrame(renderFrame);
          }).catch(() => {
            URL.revokeObjectURL(blobUrl);
            finished = true;
            runTimedFallback(34);
          });
        } else {
          rafId = requestAnimationFrame(renderFrame);
        }
      });
    }

    async function streamWordsSilent(markdown, proseEl, sessionId) {
      const { fragment, wordItems } = buildWordSyncedFragment(markdown);
      proseEl.innerHTML = '';
      proseEl.appendChild(fragment);

      for (let i = 0; i < wordItems.length; i++) {
        if (sessionId !== state.syncSessionId) return;
        const w = wordItems[i];
        if (w.lineEl.classList.contains('pending')) {
          w.lineEl.classList.remove('pending');
          scrollStreamIfNearBottom();
        }
        w.span.classList.add('revealed');
        if (i % 2 === 0) {
          await new Promise((r) => setTimeout(r, 20));
        }
      }
    }

    function stopActiveSync(revealRemaining = true) {
      state.syncSessionId++;
      try {
        syncAudio.pause();
        syncAudio.removeAttribute('src');
      } catch (_e) {}
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (revealRemaining && state.activeSyncTurn) {
        const { proseEl, fullReply, liveTagEl, sourcesEl } = state.activeSyncTurn;
        if (fullReply && proseEl) {
          proseEl.innerHTML = renderMarkdown(fullReply);
        }
        if (liveTagEl) liveTagEl.remove();
        if (sourcesEl && sourcesEl.innerHTML) sourcesEl.classList.remove('hidden');
        state.activeSyncTurn = null;
      }
      setSpeakingUI(false);
    }

    function stopVoicePreview() {
      state.testingVoice = false;
      try {
        previewAudio.pause();
        previewAudio.removeAttribute('src');
      } catch (_e) {}
      const btn = el('testVoiceBtn');
      if (btn) {
        btn.textContent = 'Test Voice';
        btn.classList.remove('playing');
      }
    }

    async function handleTestVoice() {
      unlockAudioOnGesture();
      if (state.testingVoice) {
        stopVoicePreview();
        el('modalFeedback').textContent = 'Voice preview stopped.';
        return;
      }
      stopActiveSync(true);
      const selectedVoice = el('voiceSelect').value || state.voiceId;
      const btn = el('testVoiceBtn');
      state.testingVoice = true;
      btn.textContent = 'Stop';
      btn.classList.add('playing');
      el('modalFeedback').textContent = 'Synthesizing voice sample…';

      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: 'SpecDeck voice check ready. Synchronized smartphone analysis is active.',
            voice: selectedVoice
          })
        });
        if (!res.ok) throw new Error('Preview failed');
        const blob = await res.blob();
        if (!state.testingVoice) return;
        const url = URL.createObjectURL(blob);
        previewAudio.onended = () => {
          URL.revokeObjectURL(url);
          stopVoicePreview();
          el('modalFeedback').textContent = 'Voice sample complete.';
        };
        previewAudio.onerror = () => {
          URL.revokeObjectURL(url);
          stopVoicePreview();
          el('modalFeedback').textContent = 'Could not play audio sample.';
        };
        previewAudio.src = url;
        el('modalFeedback').textContent = 'Playing neural voice preview…';
        await previewAudio.play();
      } catch (_err) {
        stopVoicePreview();
        el('modalFeedback').textContent = 'Voice preview failed — check internet connection.';
      }
    }

    function buildRadarSvg(scoresA, scoresB = null) {
      const axes = [
        { key: 'performance', label: 'PERF', anchor: 'middle', dx: 0, dy: -4 },
        { key: 'camera', label: 'OPTICS', anchor: 'start', dx: 4, dy: 0 },
        { key: 'display', label: 'DISP', anchor: 'start', dx: 3, dy: 4 },
        { key: 'battery', label: 'POWER', anchor: 'end', dx: -3, dy: 4 },
        { key: 'value', label: 'VALUE', anchor: 'end', dx: -4, dy: 0 }
      ];
      const cx = 92, cy = 84, maxR = 42;
      const angleFor = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / axes.length;
      const pt = (r, i) => [
        (cx + r * Math.cos(angleFor(i))).toFixed(1),
        (cy + r * Math.sin(angleFor(i))).toFixed(1)
      ];

      let rings = '';
      for (const frac of [0.35, 0.68, 1.0]) {
        const pts = axes.map((_, i) => pt(maxR * frac, i).join(',')).join(' ');
        rings += `<polygon points="${pts}" fill="none" stroke="#2c332f" stroke-width="1"/>`;
      }

      let spokes = '';
      let labels = '';
      axes.forEach((ax, i) => {
        const [x, y] = pt(maxR, i);
        const [lx, ly] = pt(maxR + 7, i);
        const fx = (Number(lx) + ax.dx).toFixed(1);
        const fy = (Number(ly) + ax.dy).toFixed(1);
        spokes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#262c29" stroke-width="1"/>`;
        labels += `<text x="${fx}" y="${fy}" fill="#8a9690" font-family="var(--font-mono)" font-size="8.5" text-anchor="${ax.anchor}" dominant-baseline="middle">${ax.label}</text>`;
      });

      const polyFor = (sc, stroke, fill) => {
        const pts = axes.map((ax, i) => {
          const v = Math.max(1, Math.min(10, Number(sc?.[ax.key] ?? 8)));
          return pt((v / 10) * maxR, i).join(',');
        }).join(' ');
        return `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>`;
      };

      const polyB = scoresB ? polyFor(scoresB, '#d6dfd9', 'rgba(214,223,217,0.14)') : '';
      const polyA = polyFor(scoresA, '#a31c1b', 'rgba(163,28,27,0.22)');

      return `<svg viewBox="0 0 184 164" aria-label="Hardware Telemetry Radar">
        ${rings}${spokes}${polyB}${polyA}${labels}
      </svg>`;
    }

    function renderDeck() {
      const box = el('deckContainer');
      const a = state.primaryCard;
      if (!a) return;

      if (state.activeTab === 'compare') {
        renderCompareDeck(box, a, state.compareCard);
      } else {
        renderSingleDeck(box, a);
      }
    }

    function renderSingleDeck(box, card) {
      const scoreKeys = [
        ['Performance', 'performance'],

        ['Battery', 'battery'],

          <span class="score-name">${lbl}</span>
          <div class="score-track"><div class="score-fill" style="transform: scaleX(${scale});"></div></div>
          <span class="score-num tabular">${val.toFixed(1)}</span>
        </div>`;
      }).join('');

      const specDefs = [
        ['display', 'Display', true],
        ['processor', 'Silicon / SoC', false],

        ['battery_charging', 'Power & Charge', false],

      ];

      const specsHtml = specDefs.map(([key, title, wide]) => `
        <div class="spec-cell ${wide ? 'wide' : ''}">

      ).join('');

      const imgSrc = phoneImageUrl(card);

      box.innerHTML = `

        <div class="device-hero">
          <div class="phone-photo-frame">
            <img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(card.name)}" loading="eager" />
          </div>
          <div class="hero-meta">
            <div>
              <div class="device-eyebrow">
                <span>${escapeHtml(card.brand || 'SMARTPHONE')}</span>
                <span class="status-signal">${escapeHtml(card.status || 'Available')}</span>
              </div>
              <h1 class="device-title">${escapeHtml(card.name)}</h1>
              ${card.tagline ? `<p class="device-tagline">${escapeHtml(card.tagline)}</p>` : ''}
            </div>
            <div class="hero-metrics">
              <div>
                <div class="ticker-cell-label">Launch</div>
                <div class="ticker-cell-val tabular">${escapeHtml(card.launch_date || '—')}</div>
              </div>
              <div>
                <div class="ticker-cell-label">Retail Price</div>
                <div class="ticker-cell-val price tabular">${escapeHtml(card.price_estimate || '—')}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="telemetry-block">
          <div class="radar-wrap">${buildRadarSvg(card.scores)}</div>
          <div class="score-list">${scoresHtml}</div>
        </div>

        <div class="section-caption">Hardware Specifications</div>
        <div class="bento-shell">${specsHtml}</div>

        <div class="signals-grid">
          ${goodHtml ? `<div class="signal-card">
            <div class="ticker-cell-label">Primary Strengths</div>
            <ul class="signal-list">${goodHtml}</ul>
          </div>` : ''}
          ${skipHtml ? `<div class="signal-card">
            <div class="ticker-cell-label">Trade-offs to Consider</div>
            <ul class="signal-list tradeoffs">${skipHtml}</ul>
          </div>` : ''}
        </div>

        ${card.verdict_one_liner ? `<div class="verdict-note">${escapeHtml(card.verdict_one_liner)}</div>` : ''}
      `;
    }

    function renderCompareDeck(box, a, b) {
      const valA = a?.name || '';
      const valB = b?.name || '';

      let bodyHtml = '';
      if (b) {
        const axes = [
          ['Perf', 'performance'],
          ['Optics', 'camera'],
          ['Display', 'display'],
          ['Power', 'battery'],
          ['Value', 'value']
        ];

        const deltasHtml = axes.map(([lbl, k]) => {
          const sa = Number(a.scores?.[k] ?? 8);
          const sb = Number(b.scores?.[k] ?? 8);
          const diff = (sa - sb).toFixed(1);
          const tag = sa === sb ? 'EVEN' : (sa > sb ? `A +${diff}` : `B +${Math.abs(diff).toFixed(1)}`);
          return `<div class="delta-row tabular">
            <span class="score-name">${lbl}</span>
            <div class="delta-pair">
              <span class="val-a">${sa.toFixed(1)}</span>
              <span style="color:var(--ink-muted)">/</span>
              <span class="val-b">${sb.toFixed(1)}</span>
            </div>
            <span class="delta-badge">${tag}</span>
          </div>`;

    async function replayTurnWithVoiceSync(turnObj) {
      if (!turnObj || !turnObj.fullReply) return;
      unlockAudioOnGesture();
      stopActiveSync(true);

      const sessionId = ++state.syncSessionId;
      state.activeSyncTurn = turnObj;
      setSpeakingUI(true);
      turnObj.proseEl.innerHTML = `<p class="voice-prep-indicator">Starting voice sync…</p>`;

      const segQueue = [];
      let streamFinished = false;
      let wakeConsumer = null;

      const consumerPromise = (async () => {
        let firstSeg = true;
        while (sessionId === state.syncSessionId) {
          if (segQueue.length > 0) {
            const seg = segQueue.shift();
            if (firstSeg) {
              turnObj.proseEl.innerHTML = '';
              firstSeg = false;
            }
            await playSegmentInLockstep(seg, turnObj.proseEl, sessionId);
          } else if (streamFinished) {
            break;
          } else {
            await new Promise((r) => { wakeConsumer = r; });
          }
        }
      })();

      try {
        const res = await fetch('/api/tts/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: turnObj.fullReply, voice: state.voiceId })
        });
        if (!res.ok || !res.body) throw new Error('Stream unavailable');

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (sessionId === state.syncSessionId) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const ln of lines) {
            if (!ln.trim()) continue;
            const evt = JSON.parse(ln);
            if (evt.type === 'segment') {
              segQueue.push(evt);
              if (wakeConsumer) { const w = wakeConsumer; wakeConsumer = null; w(); }
            }
          }
        }
      } catch (_err) {
        if (sessionId === state.syncSessionId) {
          turnObj.proseEl.innerHTML = renderMarkdown(turnObj.fullReply);
        }
      } finally {
        streamFinished = true;
        if (wakeConsumer) { const w = wakeConsumer; wakeConsumer = null; w(); }
      }

      await consumerPromise;
      if (sessionId === state.syncSessionId) {
        if (turnObj.liveTagEl) turnObj.liveTagEl.remove();
        if (turnObj.sourcesEl && turnObj.sourcesEl.innerHTML) turnObj.sourcesEl.classList.remove('hidden');
        state.activeSyncTurn = null;
        setSpeakingUI(false);
      }
    }

    async function submitPrompt(prompt) {
      if (!prompt || state.busy) return;

      if (!state.hasApiKey) {
        openSettings();
        showToast('Paste your Groq API key in Settings first');
        return;
      }

      stopActiveSync(true);

      state.busy = true;
      const sessionId = ++state.syncSessionId;
      const useVoiceThisTurn = state.autoVoice;

      appendUserTurn(prompt);
      const turnObj = createStreamingAiTurn();
      state.activeSyncTurn = turnObj;

      const t0 = performance.now();
      updateStatusUI(true, 'WORKING…');

      const segQueue = [];
      let streamFinished = false;
      let wakeConsumer = null;

      const consumerPromise = (async () => {
        if (!useVoiceThisTurn) return;
        let firstSeg = true;
        while (sessionId === state.syncSessionId) {
          if (segQueue.length > 0) {
            const seg = segQueue.shift();
            if (firstSeg) {
              turnObj.proseEl.innerHTML = '';
              if (turnObj.liveTextEl) turnObj.liveTextEl.textContent = 'Speaking';
              setSpeakingUI(true);
              firstSeg = false;
            }
            await playSegmentInLockstep(seg, turnObj.proseEl, sessionId);
          } else if (streamFinished) {
            break;
          } else {
            await new Promise((r) => { wakeConsumer = r; });
          }
        }
      })();

      try {
        const res = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: prompt,
            use_web_search: state.liveWeb,
            voice_sync: useVoiceThisTurn,
            voice: state.voiceId
          })
        });

        if (!res.ok || !res.body) {
          const errJson = await res.json().catch(() => ({}));
          throw new Error(errJson.detail || 'Request failed');
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let receivedSegments = 0;

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const ln of lines) {
            if (!ln.trim()) continue;
            const evt = JSON.parse(ln);

            if (evt.type === 'error') {
              throw new Error(evt.detail || 'Groq API error');
            }

            if (evt.type === 'meta') {
              turnObj.fullReply = sanitizeUiString(evt.full_reply || '');
              state.previewMode = false;

              if (evt.updated_card) {
                state.primaryCard = evt.updated_card;
              }
              if (evt.updated_compare_card) {
                state.compareCard = evt.updated_compare_card;
                state.activeTab = 'compare';
                el('tabSingle').classList.remove('active');
                el('tabCompare').classList.add('active');
              } else if (evt.updated_card) {
                state.compareCard = evt.active_compare || null;
                state.activeTab = 'single';
                el('tabSingle').classList.add('active');
                el('tabCompare').classList.remove('active');
              }

              if (evt.model_used) state.model = evt.model_used;
              renderDeck();

              const ctxParts = [sanitizeUiString(state.primaryCard?.name || '')].filter(Boolean);
              if (state.compareCard && state.activeTab === 'compare') {
                ctxParts.push('vs ' + sanitizeUiString(state.compareCard.name || ''));
              }
              el('activeContextLabel').textContent = ctxParts.join(' ') || 'Active';

              if (evt.used_web_search) {
                turnObj.verifiedSlotEl.innerHTML = '<span class="verified-tag">Web Verified</span>';
              }
              if (evt.search_sources && evt.search_sources.length) {
                turnObj.sourcesEl.innerHTML = evt.search_sources.map((s) =>
                  `<a class="source-link" href="${escapeHtml(s.url || '#')}" target="_blank" rel="noopener">${escapeHtml((s.title || 'Source').slice(0, 44))}</a>`
                ).join('');
              }

              turnObj.speakBtn.addEventListener('click', () => replayTurnWithVoiceSync(turnObj));
              turnObj.copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(turnObj.fullReply);
                showToast('Copied response');
              });

              const ms = Math.round(performance.now() - t0);
              const tok = evt.tokens_used ? `${evt.tokens_used} TOK · ` : '';
              state.busy = false;
              updateStatusUI(false, `${tok}${ms}ms`);

              if (useVoiceThisTurn) {
                if (turnObj.prepEl) turnObj.prepEl.textContent = 'Starting synchronized voice…';
              } else {
                if (turnObj.liveTagEl) turnObj.liveTagEl.remove();
                await streamWordsSilent(turnObj.fullReply, turnObj.proseEl, sessionId);
                if (turnObj.sourcesEl.innerHTML) turnObj.sourcesEl.classList.remove('hidden');
              }
            } else if (evt.type === 'segment') {
              receivedSegments++;
              segQueue.push(evt);
              if (wakeConsumer) {
                const w = wakeConsumer;
                wakeConsumer = null;
                w();
              }
            }
          }
        }

        streamFinished = true;
        if (wakeConsumer) {
          const w = wakeConsumer;
          wakeConsumer = null;
          w();
        }

        if (useVoiceThisTurn) {
          if (receivedSegments === 0 && turnObj.fullReply && sessionId === state.syncSessionId) {
            await streamWordsSilent(turnObj.fullReply, turnObj.proseEl, sessionId);
          } else {
            await consumerPromise;
          }
          if (sessionId === state.syncSessionId) {
            if (turnObj.liveTagEl) turnObj.liveTagEl.remove();
            if (turnObj.sourcesEl.innerHTML) turnObj.sourcesEl.classList.remove('hidden');
            state.activeSyncTurn = null;
            setSpeakingUI(false);
          }
        } else {
          state.activeSyncTurn = null;
        }
      } catch (err) {
        state.busy = false;
        streamFinished = true;
        if (wakeConsumer) { const w = wakeConsumer; wakeConsumer = null; w(); }
        turnObj.rootEl.remove();
        state.activeSyncTurn = null;
        setSpeakingUI(false);
        appendErrorTurn(String(err.message || err));
        updateStatusUI(false, 'READY');
      }
    }

      stopVoicePreview();
      const payload = {
        api_key: el('apiKeyInput').value.trim(),
        model: el('modelSelect').value,
        voice_id: el('voiceSelect').value,
        live_web: el('webSearchToggle').checked,
        auto_voice: el('autoVoiceToggle').checked,
        autostart: el('autostartToggle').checked
      };
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      state.hasApiKey = data.has_api_key;
      state.model = data.model;
      state.voiceId = data.voice_id;
      state.liveWeb = data.live_web;
      state.autoVoice = data.auto_voice;
      state.autostart = data.autostart;
      syncVoiceToggleIcon();
      el('apiKeyInput').value = '';
      updateStatusUI(false, state.hasApiKey ? 'READY' : 'API KEY NEEDED');
      closeSettings();
      showToast('Settings saved');
    });

    el('resetThreadBtn').addEventListener('click', async () => {
      stopActiveSync(false);
      await fetch('/api/reset', { method: 'POST' });
      state.previewMode = true;
      const st = await (await fetch('/api/state')).json();
      state.primaryCard = st.demo_primary;
      state.compareCard = st.demo_compare;
      el('activeContextLabel').textContent = sanitizeUiString(state.primaryCard?.name || 'Standby');
      renderDeck();
      renderWelcomeIndex();
      showToast('Session cleared');
    });

    el('copySheetBtn').addEventListener('click', async () => {
      const res = await fetch(`/api/export?mode=${state.activeTab}`);
      const md = await res.text();
      await navigator.clipboard.writeText(md);
      showToast('Datasheet copied');
    });

    el('exportSheetBtn').addEventListener('click', async () => {
      const res = await fetch(`/api/export?mode=${state.activeTab}`);
      const md = await res.text();
      const blob = new Blob([md], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const slug = (state.primaryCard?.name || 'specdeck').toLowerCase().replace(/[^a-z0-9]+/g, '-');
      a.download = `${slug}-report.md`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        el('omniInput').focus();
        el('omniInput').select();
      } else if ((e.metaKey || e.ctrlKey) && e.key === ',') {
        e.preventDefault();
        openSettings();
      } else if (e.key === 'Escape') {
        closeSettings();
      }
    });

    loadInitialState();
  </script>
</body>
</html>
